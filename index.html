<!DOCTYPE html>
<html lang="en" style="background-color: #000">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Idle Page</title>
    <link rel="icon" href="./icons/favicon.ico?v=5b26ad79" type="image/x-icon" />
    <link rel="manifest" href="./manifest.webmanifest">
    <meta name="theme-color" content="#000000">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="A quiet clock, date and calendar for your idle tab.">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Idle Page">

    <link rel="stylesheet" href="./css/tailwind.css?v=3d12eb5a">
    <link rel="stylesheet" href="./css/style.css?v=f3c226e0">
</head>

<body class="overflow-x-hidden selection:bg-red-900/30 selection:text-white">

    <!-- App shell: locks the layout to the real visible viewport -->
    <div class="app">

        <!-- Main Content -->
        <!-- flex-1 / justify-center come from .app>main in css/style.css -->
        <main class="relative z-10 flex w-full max-w-6xl flex-col mx-auto px-4">

            <!-- Clock + Calendar -->
            <section class="hero flex flex-col items-center">
                <!-- Clock -->
                <article
                    class="relative flex flex-col items-center text-center gap-y-4 animate-fade-in-down w-fit max-w-full">
                    <div class="absolute inset-0 flex items-center justify-center pointer-events-none -z-10">
                        <div class="w-full h-full blur-2xl bg-red-900 rounded-full"></div>
                    </div>
                    <h1
                        class="w-fit max-w-full text-white tracking-tighter font-['SF_UI_Display_Semibold']">
                        <time id="clock-time" role="timer" aria-live="off" datetime="">00:00</time>
                    </h1>
                    <time id="clock-date" datetime=""
                        class="px-2 text-neutral-500 font-bold tracking-[0.2em] uppercase font-['SF_UI_Display_Medium']">
                        Loading...
                    </time>
                </article>

                <!-- Minimal Calendar -->
                <article
                    class="group flex w-full min-w-0 max-w-100 flex-col overflow-hidden rounded-lg border border-neutral-900 bg-black/40 px-4 py-4 transition-all duration-500 animate-fade-in-down hover:border-red-900/30 hover:bg-black/60">
                    <div
                        class="flex shrink-0 flex-wrap items-center justify-between gap-x-3 gap-y-1 pb-2 mb-3 border-b border-neutral-900">
                        <div class="flex min-w-0 items-center gap-2 text-red-600">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"
                                xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M9 2a1 1 0 0 1 1 1v1h4V3a1 1 0 1 1 2 0v1h3a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h3V3a1 1 0 0 1 1-1zM8 6H5v3h14V6h-3v1a1 1 0 1 1-2 0V6h-4v1a1 1 0 0 1-2 0V6zm11 5H5v8h14v-8z" />
                            </svg>
                            <span class="text-xs font-bold tracking-widest uppercase">Calendar</span>
                        </div>
                        <div class="flex shrink-0 items-center gap-3">
                            <span id="cal-day-count" class="text-[11px] text-red-500/70 cursor-help"></span>
                            <button id="cal-today"
                                class="py-1 -my-1 text-[11px] text-neutral-600 hover:text-red-500 transition-colors"
                                type="button">
                                TODAY
                            </button>
                        </div>
                    </div>

                    <div class="flex shrink-0 items-center justify-between gap-2">
                        <button id="cal-prev" type="button"
                            class="p-2 -m-1 text-neutral-600 hover:text-white transition-colors"
                            aria-label="Previous month">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"
                                xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M14.707 5.293a1 1 0 0 1 0 1.414L9.414 12l5.293 5.293a1 1 0 0 1-1.414 1.414l-6-6a1 1 0 0 1 0-1.414l6-6a1 1 0 0 1 1.414 0z" />
                            </svg>
                        </button>
                        <div class="truncate text-xs tracking-widest uppercase text-neutral-400 font-['SF_UI_Display_Medium']"
                            id="cal-month" aria-live="polite">
                            --
                        </div>
                        <button id="cal-next" type="button"
                            class="p-2 -m-1 text-neutral-600 hover:text-white transition-colors"
                            aria-label="Next month">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"
                                xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M9.293 18.707a1 1 0 0 1 0-1.414L14.586 12 9.293 6.707a1 1 0 0 1 1.414-1.414l6 6a1 1 0 0 1 0 1.414l-6 6a1 1 0 0 1-1.414 0z" />
                            </svg>
                        </button>
                    </div>

                    <div class="grid shrink-0 grid-cols-7 gap-2 mt-3 text-[10px] text-neutral-600"
                        aria-hidden="true">
                        <span class="text-center">M</span>
                        <span class="text-center">T</span>
                        <span class="text-center">W</span>
                        <span class="text-center">T</span>
                        <span class="text-center">F</span>
                        <span class="text-center">S</span>
                        <span class="text-center">S</span>
                    </div>

                    <div id="cal-grid" class="grid grid-cols-7 gap-2 mt-2" role="group"
                        aria-label="Days of the month"></div>
                </article>
            </section>

        </main>

        <!-- Footer -->
        <footer
            class="w-full py-4 pb-[max(1rem,env(safe-area-inset-bottom))] px-4 text-xs text-center pointer-events-none text-neutral-900">
            <p>Idle Page • Scarpy • <span id="year"></span></p>
        </footer>

    </div>
    <script src="./js/calendar.js?v=b784226e"></script>
    <script src="./js/clock.js?v=c5fce605"></script>
    <script>
        // Offline support. Only works on https or localhost: browsers do not
        // allow service workers on plain http origins such as a LAN IP.
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(() => { });
        }
    </script>
</body>

</html>
